<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menü — FoodMicro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ===== NAVBAR ===== -->
<nav class="navbar scrolled">
  <div class="nav-inner">
    <a href="index.html" class="nav-logo">
      <span class="logo-icon">🍕</span>
      <span class="logo-text">Food<span>Micro</span></span>
    </a>
    <ul class="nav-links">
      <li><a href="index.html">Ana Sayfa</a></li>
      <li><a href="menu.html" class="active">Menü</a></li>
      <li><a href="orders.html">Siparişlerim</a></li>
    </ul>
    <div class="nav-actions">
      <div class="nav-auth" style="display:flex;gap:.75rem;align-items:center;">
        <a href="auth.html"><button class="btn-ghost">Giriş Yap</button></a>
        <a href="auth.html"><button class="btn-primary">Kayıt Ol</button></a>
      </div>
      <button class="cart-btn" onclick="openCart()">
        🛒
        <span class="cart-badge">0</span>
      </button>
      <button class="nav-toggle" onclick="document.querySelector('.nav-mobile').classList.toggle('open')">☰</button>
    </div>
  </div>
</nav>

<!-- Mobile Nav -->
<div class="nav-mobile">
  <a href="index.html">🏠 Ana Sayfa</a>
  <a href="menu.html">🍽️ Menü</a>
  <a href="orders.html">📦 Siparişlerim</a>
  <a href="auth.html">🔐 Giriş / Kayıt</a>
</div>

<!-- ===== PAGE HERO ===== -->
<div class="page-hero">
  <div class="page-hero-inner">
    <h1 class="page-title">🍽️ Menümüz</h1>
    <p class="page-subtitle">En taze malzemelerle hazırlanan lezzetleri keşfet</p>
    <!-- Category Bar (built by JS) -->
    <div class="categories-bar"></div>
  </div>
</div>

<!-- ===== PRODUCTS ===== -->
<section class="section" style="padding-top:2rem">
  <div class="section-inner">
    <div class="products-grid"></div>
  </div>
</section>

<!-- ===== FOOTER ===== -->
<footer class="footer">
  <div class="footer-bottom" style="max-width:1280px;margin:0 auto;">
    <span class="footer-copy">© 2026 FoodMicro. Tüm hakları saklıdır.</span>
    <div class="footer-tech">
      <span class="tech-tag">Python Flask</span>
      <span class="tech-tag">Docker</span>
      <span class="tech-tag">AWS ECS</span>
      <span class="tech-tag">MySQL RDS</span>
    </div>
  </div>
</footer>

<!-- ===== CART SIDEBAR ===== -->
<div class="cart-overlay" onclick="closeCart()"></div>
<div class="cart-sidebar">
  <div class="cart-header">
    <h3 class="cart-title">🛒 Sepetim</h3>
    <button class="cart-close" onclick="closeCart()">✕</button>
  </div>
  <div class="cart-items"></div>
  <div class="cart-footer">
    <div class="cart-total">
      <span>Toplam:</span>
      <span class="cart-total-price">0 ₺</span>
    </div>
    <button class="btn-checkout" onclick="checkout()">✓ Siparişi Tamamla</button>
  </div>
</div>

<div class="toast-container"></div>

<script src="js/api.js"></script>
<script src="js/cart.js"></script>
<script src="js/app.js"></script>
</body>
</html>
