name: DevSecOps CI/CD Pipeline (Free Tier)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: "Test and Lint ${{ matrix.service }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [auth-service, product-service, order-service, payment-service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r services/${{ matrix.service }}/requirements.txt
          pip install pylint pytest pytest-cov
      - name: Run pylint
        run: pylint services/${{ matrix.service }}/src/app.py --disable=C0114,C0115,C0116 --fail-under=7.0
      - name: Run pytest
        run: pytest services/${{ matrix.service }}/tests/ -v
        env:
          PYTHONPATH: services/${{ matrix.service }}/src

  security-scan:
    name: "Security Scan ${{ matrix.service }}"
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        service: [auth-service, product-service, order-service, payment-service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run Safety
        run: |
          pip install safety
          safety check -r services/${{ matrix.service }}/requirements.txt --output text
        continue-on-error: true
      - uses: docker/setup-buildx-action@v3
      - name: Build image for scanning
        run: docker build -t ${{ matrix.service }}:scan -f services/${{ matrix.service }}/Dockerfile services/${{ matrix.service }}
      - name: Run Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ matrix.service }}:scan"
          format: "table"
          severity: "HIGH,CRITICAL"
          exit-code: "0"

  build-and-push:
    name: "Build and Push ${{ matrix.service }}"
    runs-on: ubuntu-latest
    needs: security-scan
    if: github.ref == 'refs/heads/main'
    strategy:
      matrix:
        service: [auth-service, product-service, order-service, payment-service]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        run: echo "tag=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: services/${{ matrix.service }}
          file: services/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/food-ordering-${{ matrix.service }}:latest

  deploy:
    name: "Deploy to EC2"
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ec2-user/food-ordering/infrastructure/docker
            docker-compose pull
            docker-compose up -d --remove-orphans
            sleep 10
            curl -f http://localhost:8001/health || exit 1
            curl -f http://localhost:8002/health || exit 1
            curl -f http://localhost:8003/health || exit 1
            curl -f http://localhost:8004/health || exit 1
            echo "All services healthy!"
