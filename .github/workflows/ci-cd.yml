name: DevSecOps CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  AWS_REGION: eu-central-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.eu-central-1.amazonaws.com
  ECS_CLUSTER: food-ordering-cluster

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Code Quality & Unit Tests
  # ─────────────────────────────────────────────
  test:
    name: "🧪 Test & Lint (${{ matrix.service }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [auth-service, product-service, order-service, payment-service]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: services/${{ matrix.service }}/requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r services/${{ matrix.service }}/requirements.txt
          pip install pylint pytest pytest-cov

      - name: Run pylint
        run: |
          pylint services/${{ matrix.service }}/src/app.py \
            --disable=C0114,C0115,C0116 \
            --fail-under=7.0
        continue-on-error: false

      - name: Run pytest with coverage
        run: |
          pytest services/${{ matrix.service }}/tests/ \
            --cov=services/${{ matrix.service }}/src \
            --cov-report=xml:coverage-${{ matrix.service }}.xml \
            --cov-report=term-missing \
            -v
        env:
          PYTHONPATH: services/${{ matrix.service }}/src

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.service }}
          path: coverage-${{ matrix.service }}.xml

  # ─────────────────────────────────────────────
  # JOB 2: Security Scanning (Shift-Left)
  # ─────────────────────────────────────────────
  security-scan:
    name: "🔒 Security Scan (${{ matrix.service }})"
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        service: [auth-service, product-service, order-service, payment-service]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install safety
        run: pip install safety

      - name: Run Safety (dependency vulnerability check)
        run: |
          safety check \
            -r services/${{ matrix.service }}/requirements.txt \
            --output text \
            --exit-code 1
        continue-on-error: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image for scanning
        run: |
          docker build \
            -t ${{ matrix.service }}:scan \
            -f services/${{ matrix.service }}/Dockerfile \
            services/${{ matrix.service }}

      - name: Install Trivy
        run: |
          sudo apt-get install -y wget apt-transport-https gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
          echo "deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update && sudo apt-get install -y trivy

      - name: Run Trivy vulnerability scan
        run: |
          trivy image \
            --exit-code 1 \
            --severity HIGH,CRITICAL \
            --no-progress \
            --format table \
            ${{ matrix.service }}:scan

      - name: Run Trivy SARIF report (for GitHub Security tab)
        if: always()
        run: |
          trivy image \
            --exit-code 0 \
            --format sarif \
            --output trivy-${{ matrix.service }}.sarif \
            ${{ matrix.service }}:scan

      - name: Upload Trivy SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
          category: trivy-${{ matrix.service }}

  # ─────────────────────────────────────────────
  # JOB 3: Build & Push to ECR
  # ─────────────────────────────────────────────
  build-and-push:
    name: "🐳 Build & Push (${{ matrix.service }})"
    runs-on: ubuntu-latest
    needs: security-scan
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    strategy:
      matrix:
        include:
          - service: auth-service
            port: 8001
          - service: product-service
            port: 8002
          - service: order-service
            port: 8003
          - service: payment-service
            port: 8004

    outputs:
      image-tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Generate image metadata
        id: meta
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          echo "version=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "image=${{ env.ECR_REGISTRY }}/food-ordering/${{ matrix.service }}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: services/${{ matrix.service }}
          file: services/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}

  # ─────────────────────────────────────────────
  # JOB 4: Deploy to Staging
  # ─────────────────────────────────────────────
  deploy-staging:
    name: "🚀 Deploy to Staging (${{ matrix.service }})"
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/develop'
    environment: staging
    strategy:
      matrix:
        include:
          - service: auth-service
            ecs-service: auth-service-staging
          - service: product-service
            ecs-service: product-service-staging
          - service: order-service
            ecs-service: order-service-staging
          - service: payment-service
            ecs-service: payment-service-staging

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get current ECS task definition
        id: get-task-def
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ matrix.service }}-staging \
            --query taskDefinition \
            > task-def-${{ matrix.service }}.json

      - name: Update image in task definition
        id: update-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-def-${{ matrix.service }}.json
          container-name: ${{ matrix.service }}
          image: ${{ env.ECR_REGISTRY }}/food-ordering/${{ matrix.service }}:${{ needs.build-and-push.outputs.image-tag }}

      - name: Deploy to ECS Staging
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.update-task-def.outputs.task-definition }}
          service: ${{ matrix.ecs-service }}
          cluster: ${{ env.ECS_CLUSTER }}-staging
          wait-for-service-stability: true

  # ─────────────────────────────────────────────
  # JOB 5: Integration Tests on Staging
  # ─────────────────────────────────────────────
  integration-tests:
    name: "🔗 Integration Tests"
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.ref == 'refs/heads/develop'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: pip install pytest requests

      - name: Run integration tests against staging
        run: |
          pytest tests/integration/ -v \
            --tb=short \
            -x
        env:
          AUTH_SERVICE_URL: ${{ secrets.STAGING_AUTH_URL }}
          PRODUCT_SERVICE_URL: ${{ secrets.STAGING_PRODUCT_URL }}
          ORDER_SERVICE_URL: ${{ secrets.STAGING_ORDER_URL }}
          PAYMENT_SERVICE_URL: ${{ secrets.STAGING_PAYMENT_URL }}

  # ─────────────────────────────────────────────
  # JOB 6: Deploy to Production (manual approval)
  # ─────────────────────────────────────────────
  deploy-production:
    name: "🏭 Deploy to Production (${{ matrix.service }})"
    runs-on: ubuntu-latest
    needs: [build-and-push, integration-tests]
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://api.food-ordering.com
    strategy:
      matrix:
        include:
          - service: auth-service
            ecs-service: auth-service-prod
          - service: product-service
            ecs-service: product-service-prod
          - service: order-service
            ecs-service: order-service-prod
          - service: payment-service
            ecs-service: payment-service-prod

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get current ECS task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ matrix.service }}-prod \
            --query taskDefinition \
            > task-def-${{ matrix.service }}.json

      - name: Update image in task definition
        id: update-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-def-${{ matrix.service }}.json
          container-name: ${{ matrix.service }}
          image: ${{ env.ECR_REGISTRY }}/food-ordering/${{ matrix.service }}:${{ needs.build-and-push.outputs.image-tag }}

      - name: Deploy to ECS Production
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.update-task-def.outputs.task-definition }}
          service: ${{ matrix.ecs-service }}
          cluster: ${{ env.ECS_CLUSTER }}-prod
          wait-for-service-stability: true

      - name: Notify deployment success
        if: success()
        run: |
          echo "✅ ${{ matrix.service }} deployed to production successfully!"
          echo "Image: ${{ env.ECR_REGISTRY }}/food-ordering/${{ matrix.service }}:${{ needs.build-and-push.outputs.image-tag }}"
