name: DevSecOps CI/CD Pipeline (Free Tier)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  EC2_HOST: ${{ secrets.EC2_HOST }}
  EC2_USER: ec2-user

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Code Quality & Unit Tests
  # ─────────────────────────────────────────────
  test:
    name: "🧪 Test & Lint (${{ matrix.service }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [auth-service, product-service, order-service, payment-service]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: services/${{ matrix.service }}/requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r services/${{ matrix.service }}/requirements.txt
          pip install pylint pytest pytest-cov

      - name: Run pylint
        run: |
          pylint services/${{ matrix.service }}/src/app.py \
            --disable=C0114,C0115,C0116 \
            --fail-under=7.0

      - name: Run pytest with coverage
        run: |
          pytest services/${{ matrix.service }}/tests/ \
            --cov=services/${{ matrix.service }}/src \
            --cov-report=xml:coverage-${{ matrix.service }}.xml \
            --cov-report=term-missing \
            -v
        env:
          PYTHONPATH: services/${{ matrix.service }}/src

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.service }}
          path: coverage-${{ matrix.service }}.xml

  # ─────────────────────────────────────────────
  # JOB 2: Security Scanning (Shift-Left)
  # ─────────────────────────────────────────────
  security-scan:
    name: "🔒 Security Scan (${{ matrix.service }})"
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        service: [auth-service, product-service, order-service, payment-service]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install safety
        run: pip install safety

      - name: Run Safety (dependency vulnerability check)
        run: |
          safety check \
            -r services/${{ matrix.service }}/requirements.txt \
            --output text
        continue-on-error: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image for scanning
        run: |
          docker build \
            -t ${{ matrix.service }}:scan \
            -f services/${{ matrix.service }}/Dockerfile \
            services/${{ matrix.service }}

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ matrix.service }}:scan
          format: table
          severity: HIGH,CRITICAL
          exit-code: 0

  # ─────────────────────────────────────────────
  # JOB 3: Build & Push to Docker Hub (FREE)
  # ─────────────────────────────────────────────
  build-and-push:
    name: "🐳 Build & Push (${{ matrix.service }})"
    runs-on: ubuntu-latest
    needs: security-scan
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    strategy:
      matrix:
        service: [auth-service, product-service, order-service, payment-service]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image tag
        id: meta
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          echo "tag=${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push to Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: services/${{ matrix.service }}
          file: services/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/food-ordering-${{ matrix.service }}:${{ steps.meta.outputs.tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/food-ordering-${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────
  # JOB 4: Deploy to EC2 (FREE t3.micro)
  # ─────────────────────────────────────────────
  deploy:
    name: "🚀 Deploy to EC2"
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: http://${{ secrets.EC2_HOST }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ec2-user/food-ordering/infrastructure/docker

            docker-compose pull
            docker-compose up -d --remove-orphans

            sleep 10
            curl -f http://localhost:8001/health || exit 1
            curl -f http://localhost:8002/health || exit 1
            curl -f http://localhost:8003/health || exit 1
            curl -f http://localhost:8004/health || exit 1

            echo "✅ All services healthy!"